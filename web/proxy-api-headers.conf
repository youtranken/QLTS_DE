# Header chung cho mọi location proxy về api
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $fwd_proto;
proxy_set_header X-Request-Id $request_id;
# Defense-in-depth: header dev-identity (AUTH_DEV_MODE) KHÔNG bao giờ được đi qua edge —
# kể cả khi ai đó lỡ bật AUTH_DEV_MODE sau nginx (test 403 gọi thẳng api, không qua nginx)
proxy_set_header x-dev-user-sub "";
proxy_set_header x-dev-role "";
