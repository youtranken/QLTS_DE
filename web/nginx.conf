# SPA + reverse-proxy /api → api:3000.
# Model B: HTTP thuần sau EDGE — TLS/HTTPS do deploy/edge (id/qlts.pmh.com.vn) lo.
# Một origin duy nhất (qlts.pmh.com.vn) VẪN giữ: browser chỉ thấy edge:443, cookie
# httpOnly + SameSite=Strict (AD-8) không đổi. Cert/443 đã bỏ ở đây (edge giữ cert).

# Honor X-Forwarded-Proto do EDGE gửi (edge báo 'https'). Gọi thẳng qlts-web (không
# qua edge) thì fallback $scheme. map PHẢI ở http context → đặt đầu file conf.d này.
map $http_x_forwarded_proto $fwd_proto {
  default $http_x_forwarded_proto;
  ''      $scheme;
}

server {
  listen 80;
  server_name qlts.pmh.com.vn;

  # Security headers (không phụ thuộc TLS — giữ). HSTS chuyển lên edge.
  add_header X-Frame-Options        'DENY' always;
  add_header X-Content-Type-Options 'nosniff' always;
  add_header Referrer-Policy        'strict-origin-when-cross-origin' always;
  add_header Permissions-Policy     'geolocation=(), camera=(), microphone=()' always;

  # DNS nội bộ Docker + re-resolve: api recreate đổi IP không làm nginx 502 vĩnh viễn
  resolver 127.0.0.11 valid=10s ipv6=off;

  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }

  # /api đúng chuỗi (không slash) — vẫn về backend, không rơi vào SPA fallback trả HTML
  location = /api {
    set $api_upstream http://api:3000;
    proxy_pass $api_upstream;
    include /etc/nginx/proxy-api-headers.conf;
  }

  location /api/ {
    set $api_upstream http://api:3000;
    proxy_pass $api_upstream;
    include /etc/nginx/proxy-api-headers.conf;
    # review 2.8: mặc định nginx cap body 1MB — upload biên bản 20MB gãy ở proxy
    # dù API cho phép; 21m = trần multer 20MB + overhead multipart
    client_max_body_size 21m;
  }
}
