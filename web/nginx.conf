# SPA + reverse-proxy /api → api:3000
# Một origin duy nhất: bắt buộc cho cookie httpOnly + SameSite=Strict (AD-8, story 1.2)
# TLS: domain qlts.pmh.com.vn, cert wildcard *.pmh.com.vn mount tại /etc/nginx/ssl (compose).

# HTTP → HTTPS (không phục vụ nội dung trên 80)
server {
  listen 80;
  server_name qlts.pmh.com.vn;
  return 308 https://$host$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name qlts.pmh.com.vn;

  ssl_certificate     /etc/nginx/ssl/fullchain.pem;
  ssl_certificate_key /etc/nginx/ssl/private.key;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_session_cache   shared:SSL:10m;
  ssl_session_timeout 10m;
  # HTTPS-only → ép browser dùng TLS (khớp cookie Secure của AD-8)
  add_header Strict-Transport-Security 'max-age=31536000' always;
  # Security headers (audit 2026-07-16 O1/OWASP A05). An toàn với SPA:
  #  - X-Frame-Options DENY: chống clickjacking (không cho nhúng QLTS vào iframe)
  #  - nosniff: chặn MIME-sniffing; Referrer-Policy: không rò URL nội bộ qua Referer
  add_header X-Frame-Options        'DENY' always;
  add_header X-Content-Type-Options 'nosniff' always;
  add_header Referrer-Policy        'strict-origin-when-cross-origin' always;
  add_header Permissions-Policy     'geolocation=(), camera=(), microphone=()' always;
  # CSP: BẬT SAU khi test staging (Vite có thể cần nới script-src/style-src). Mở DevTools
  # Console kiểm CSP violation trước khi go-live. Frame-ancestors 'none' = lớp chống clickjacking thứ 2.
  # add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'" always;

  # DNS nội bộ Docker + re-resolve: api container recreate đổi IP không làm nginx 502 vĩnh viễn
  resolver 127.0.0.11 valid=10s ipv6=off;

  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }

  # /api đúng chuỗi (không slash) — vẫn về backend, không rơi vào SPA fallback trả HTML
  location = /api {
    set $api_upstream http://api:3000;
    proxy_pass $api_upstream;
    include /etc/nginx/proxy-api-headers.conf;
  }

  location /api/ {
    set $api_upstream http://api:3000;
    proxy_pass $api_upstream;
    include /etc/nginx/proxy-api-headers.conf;
    # review 2.8: mặc định nginx cap body 1MB — upload biên bản 20MB gãy ở proxy
    # dù API cho phép; 21m = trần multer 20MB + overhead multipart
    client_max_body_size 21m;
  }
}
