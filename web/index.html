<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QLTS — Quản Lý Tài Sản</title>
    <!-- Đặt theme TRƯỚC khi render → không chớp sáng/tối. Lưu ý: chỉ theme, KHÔNG token (AD-8). -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('qlts_theme');
          if (t !== 'dark' && t !== 'light') {
            t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.dataset.theme = t;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
